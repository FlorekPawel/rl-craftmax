default_language_version:
  python: python3.12

default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

exclude: |
  (?x)^(
    docs/_build/|
    \.venv/|
    dist/|
    \.pytest_cache/|
    \.ruff_cache/|
    \.pytest_benchmark/
  )

minimum_prek_version: "0.5.0"

ci:
  autofix_commit_msg: |
    chore: apply prek autofixes
  autoupdate_commit_msg: |
    chore: prek autoupdate

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
        exclude: ^papers/
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: forbid-new-submodules

  - repo: local
    hooks:
      - id: name-tests-test
        name: python tests naming
        entry: >-
          bash -c 'status=0; for f in "$@"; do base=$(basename "$f");
          case "$base" in conftest.py|__init__.py|_*) continue ;; test_*.py) ;; *)
          echo "Test files must be named test_*.py -> $f"; status=1;; esac; done;
          exit $status'
        language: system
        files: ^tests/.*\.py$
        pass_filenames: true

      - id: uv-lock
        name: uv lock check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
        always_run: false

      - id: mypy
        name: mypy
        entry: uv run mypy --config-file=pyproject.toml
        language: system
        files: ^src/
        pass_filenames: false

      - id: ty
        name: ty (advisory)
        entry: bash -c 'uv run ty check src || true'
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: push-check
        name: make push-check (tests of the changed code, hooks; CI runs all tests)
        entry: make push-check
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args: [-q, --min-severity=medium, --config, .github/zizmor.yml]
        files: ^\.github/workflows/[^/]+\.ya?ml$

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        exclude: ^tests/

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        # The words codespell accepts: [tool.codespell] in pyproject.toml.
        args: [--toml, pyproject.toml]
        exclude: |
          (?x)^(
            uv\.lock|
            LICENSE|
            docs/_build/|
            examples/.*\.ipynb
          )
